[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Que los buscadores no indexen el panel ni la ruleta
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/ruleta*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
