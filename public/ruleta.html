<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Ruleta · Rifa Laura Zuluaga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body.stage {
      background: radial-gradient(ellipse at top, #3a2230 0%, #1c1210 60%) fixed; color: #fff; min-height: 100vh;
    }
    .stage-in { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 22px 16px 30px; }
    .stage-head { text-align: center; max-width: 760px; }
    .stage-head .eyebrow { color: var(--gold); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: .8rem; }
    .stage-head h1 { font-family: var(--display); font-size: clamp(1.4rem, 3.4vw, 2.2rem); line-height: 1.15; margin: 6px 0 4px; }
    .stage-head p { margin: 0; opacity: .7; }

    .wheel-box { position: relative; margin: 22px auto 0; width: min(88vw, 64vh, 620px); aspect-ratio: 1; }
    .wheel-box canvas { width: 100%; height: 100%; display: block; filter: drop-shadow(0 18px 50px rgba(0,0,0,.55)); }
    .pointer {
      position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 0; height: 0; z-index: 2;
      border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 34px solid #fff;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,.5));
    }

    .ticker { margin-top: 20px; text-align: center; min-height: 92px; }
    .ticker .num { font-family: var(--display); font-weight: 700; font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: 1; font-variant-numeric: tabular-nums; color: var(--gold); }
    .ticker .name { font-size: 1.15rem; opacity: .9; margin-top: 6px; min-height: 1.5em; }

    .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
    .btn.spin { font-size: 1.15rem; padding: 16px 44px; background: var(--gold); color: #2a1d18; box-shadow: 0 10px 30px rgba(215,160,63,.35); }
    .btn.spin:hover { background: #e6b250; }
    .btn.glass { background: rgba(255,255,255,.08); color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18); }
    .btn.glass:hover { background: rgba(255,255,255,.14); }
    .meta { margin-top: 14px; opacity: .6; font-size: .9rem; text-align: center; }

    /* Ganador */
    .win {
      position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; padding: 20px;
      background: rgba(10, 6, 5, .72); backdrop-filter: blur(4px);
    }
    .win.open { display: flex; }
    .win-card {
      background: var(--paper); color: var(--ink); border-radius: 26px; padding: 34px 28px 26px; text-align: center;
      width: min(480px, 100%); animation: pop .5s cubic-bezier(.2, 1.4, .4, 1);
    }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } }
    .win-card .k { color: var(--accent); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: .85rem; }
    .win-card .big { font-family: var(--display); font-size: 5rem; font-weight: 700; line-height: 1; margin: 10px 0 8px; color: var(--plum); font-variant-numeric: tabular-nums; }
    .win-card .who { font-family: var(--display); font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
    .win-card .cel { color: var(--muted); margin-top: 4px; }
    .win-card .acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; }
    .demo-tag { position: fixed; top: 12px; left: 12px; background: var(--gold); color: #2a1d18; font-weight: 700; padding: 4px 10px; border-radius: 99px; font-size: .8rem; }
  </style>
</head>
<body class="stage">
  <div class="login" id="v-login" style="color:var(--ink)">
    <form class="card" id="login-form">
      <h1>Ruleta de la rifa</h1>
      <p class="hint" style="margin:0 0 18px">Ingresa la contraseña de administración para cargar los números pagados.</p>
      <div class="field">
        <label for="pw">Contraseña</label>
        <input type="password" id="pw" autocomplete="current-password" required />
      </div>
      <div class="error" id="login-err"></div>
      <button class="btn" style="width:100%" type="submit">Entrar</button>
      <p class="hint" style="margin:14px 0 0;text-align:center"><a href="?demo">Probar con datos de ejemplo</a></p>
    </form>
  </div>

  <div class="stage-in" id="v-app" hidden>
    <div class="stage-head">
      <div class="eyebrow">Gran sorteo</div>
      <h1 id="h-titulo"></h1>
      <p id="h-premio"></p>
    </div>

    <div class="wheel-box">
      <div class="pointer"></div>
      <canvas id="wheel" width="1240" height="1240"></canvas>
    </div>

    <div class="ticker">
      <div class="num" id="t-num">—</div>
      <div class="name" id="t-name"></div>
    </div>

    <div class="controls">
      <button class="btn spin" id="spin" type="button">Girar la ruleta</button>
    </div>
    <div class="controls">
      <button class="btn glass sm" id="reload" type="button">Recargar participantes</button>
      <button class="btn glass sm" id="sound" type="button">Sonido: sí</button>
      <button class="btn glass sm" id="full" type="button">Pantalla completa</button>
    </div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="win" id="win">
    <div class="win-card">
      <div class="k">¡Tenemos ganador!</div>
      <div class="big" id="w-num"></div>
      <div class="who" id="w-name"></div>
      <div class="cel" id="w-cel"></div>
      <div class="acts">
        <button class="btn" id="w-save" type="button">Guardar resultado</button>
        <button class="btn ghost" id="w-close" type="button">Cerrar</button>
      </div>
    </div>
  </div>

  <canvas id="confetti"></canvas>
  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="ruleta.js"></script>
</body>
</html>
